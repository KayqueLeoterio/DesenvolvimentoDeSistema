spring.application.name=cadastro-service
server.port=8081


# Banco H2 gravado em arquivo (pasta ./banco)
spring.datasource.url=jdbc:h2:file:./banco/cadastro
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Enderecos dos outros servicos
servicos.turmas.url=http://172.16.0.72:8082

servicos.matriculas.url=http://172.16.1.35:8083

# Timeouts das chamadas HTTP (ms)
servicos.http.connect-timeout=2000
servicos.http.read-timeout=3000
